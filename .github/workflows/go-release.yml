on:
  workflow_call:
    inputs:
      build_command:
        default: go build -v ./...
        description: The command that builds the project (ignored when use_goreleaser is true)
        required: false
        type: string
      files:
        default: ""
        description: A newline-delimited glob of paths to assets to upload (ignored when use_goreleaser is true)
        required: false
        type: string
      go_version:
        default: 1.26
        description: The version of Go to build
        required: false
        type: number
      install_ko:
        default: false
        description: Whether to install Ko or not
        required: false
        type: boolean
      install_task:
        default: true
        description: Whether to install Task or not
        required: false
        type: boolean
      require_semantic_versioning:
        default: true
        description: Whether to require tag_name to start with v and be a semantic version (e.g. v1.2.3)
        required: false
        type: boolean
      tag_name:
        description: The name of the tag/release to use
        required: true
        type: string
      upload:
        default: false
        description: Whether to upload assets during the release (ignored when use_goreleaser is true)
        required: false
        type: boolean
      use_goreleaser:
        default: false
        description: Build and publish the release with GoReleaser instead of build_command, files and softprops/action-gh-release
        required: false
        type: boolean

jobs:
  main:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Runs first, so a bad tag name fails the run before anything is checked out, built or tagged
      - if: ${{ inputs.require_semantic_versioning }}
        name: Validate Tag Name
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$TAG_NAME" != v* ]]; then
            echo "Tag name '$TAG_NAME' must start with v (e.g. v1.2.3). Set require_semantic_versioning to false to skip this check." >&2
            exit 1
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if [[ ! "${TAG_NAME#v}" =~ $semver ]]; then
            echo "Tag name '$TAG_NAME' is not a semantic version (e.g. v1.2.3, see https://semver.org). Set require_semantic_versioning to false to skip this check." >&2
            exit 1
          fi

      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and tags, and releases exactly the commit this run was dispatched on, even if main has moved on since
          fetch-depth: ${{ inputs.use_goreleaser && '0' || '1' }}
          ref: ${{ inputs.use_goreleaser && github.sha || 'main' }}

      - name: Set up Go
        uses: emmahsax/github-actions/setup-go@main
        with:
          github_token: ${{ secrets.github_token }}
          go_version: ${{ inputs.go_version }}
          install_ko: ${{ inputs.install_ko }}
          install_task: ${{ inputs.install_task }}

      # Builds everything without publishing, so a build or config problem fails the run before the tag is pushed
      - if: ${{ inputs.use_goreleaser }}
        name: GoReleaser Dry Run
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --skip=publish --snapshot
          distribution: goreleaser
          version: ~> v2

      - if: ${{ inputs.use_goreleaser }}
        name: Create Tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG_NAME" > /dev/null; then
            if [ "$(git rev-parse "$TAG_NAME^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG_NAME already exists on a different commit than $(git rev-parse --short HEAD). Delete the tag (and any release for it) to release again." >&2
              exit 1
            fi
            echo "Tag $TAG_NAME already exists on this commit"
          else
            git tag "$TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - if: ${{ inputs.use_goreleaser }}
        name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          args: release --clean
          distribution: goreleaser
          version: ~> v2

      - if: ${{ !inputs.use_goreleaser }}
        name: Go Build
        run: ${{ inputs.build_command }}

      - if: ${{ !inputs.use_goreleaser && inputs.upload }}
        name: GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v3
        env:
          github_token: ${{ secrets.github_token }}
        with:
          draft: false
          files: ${{ inputs.files }}
          generate_release_notes: true
          name: ${{ inputs.tag_name }}
          prerelease: false
          tag_name: ${{ inputs.tag_name }}

      - if: ${{ !inputs.use_goreleaser && inputs.upload == false }}
        name: GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          github_token: ${{ secrets.github_token }}
        with:
          draft: false
          generate_release_notes: true
          name: ${{ inputs.tag_name }}
          prerelease: false
          tag_name: ${{ inputs.tag_name }}
