on:
  workflow_call:
    inputs:
      branch:
        description: The branch to check out
        required: true
        type: string
      build_command:
        default: go build -v ./...
        required: false
        type: string
      go_version:
        default: 1.26
        description: The version of Go to build
        required: false
        type: number
      install_goreleaser:
        default: false
        description: Whether to install GoReleaser or not
        required: false
        type: boolean
      install_ko:
        default: false
        description: Whether to install Ko or not
        required: false
        type: boolean
      install_task:
        default: true
        description: Whether to install Task or not
        required: false
        type: boolean
      runners:
        default: '["ubuntu-latest"]'
        description: JSON array of runner labels to run the job on, e.g. '["ubuntu-latest", "macos-latest", "windows-latest"]'
        required: false
        type: string
      staticcheck:
        default: true
        description: Whether to run staticcheck or not
        required: false
        type: boolean
      staticcheck_version:
        default: latest
        description: The staticcheck version to install, e.g. latest, master, or a release such as 2026.2.1
        required: false
        type: string
      test_command:
        default: go test -v ./...
        required: false
        type: string
      vet_command:
        default: go vet -v ./...
        required: false
        type: string

jobs:
  main:
    permissions:
      contents: read
    # Run caller-provided commands (build_command, test_command, ...) in bash on every OS, including Windows where the default would be PowerShell
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    steps:
      # Windows runners convert LF to CRLF on checkout by default, which makes gofmt report every file as unformatted
      - name: Keep LF Line Endings
        run: git config --global core.autocrlf false

      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Go
        uses: emmahsax/github-actions/setup-go@install-goreleaser-option
        with:
          github_token: ${{ secrets.github_token }}
          go_version: ${{ inputs.go_version }}
          install_goreleaser: ${{ inputs.install_goreleaser }}
          install_ko: ${{ inputs.install_ko }}
          install_task: ${{ inputs.install_task }}

      - name: Go Build
        run: ${{ inputs.build_command }}

      - name: Go Test
        run: ${{ inputs.test_command }}

      - name: Go Vet
        run: ${{ inputs.vet_command }}

      - name: Go FMT
        uses: emmahsax/github-actions/gofmt-check@main
        with:
          gofmt_flags: '-l -d'
          gofmt_path: ./

      - if: ${{ inputs.staticcheck }}
        name: Go Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
          cache-key: ${{ inputs.go_version }}
          version: ${{ inputs.staticcheck_version }}
          working-directory: ./
